name: dco

on: [pull_request]

permissions:
  contents: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for c in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $c is not signed off. Use: git commit -s"
              fail=1
            fi
          done
          exit $fail
