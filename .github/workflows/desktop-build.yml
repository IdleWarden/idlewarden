# Construit l'installeur Windows et l'attache à la release du paquet `desktop`.
#
# Jusqu'ici rien ne produisait de binaire téléchargeable : `release.yml` ne fait
# que du versionnage FerrFlow, et l'application n'existait donc nulle part sous
# une forme installable. C'est ce que ce workflow ajoute.
#
# Volontairement séparé de `ci.yml` : la CI valide chaque commit et doit rester
# rapide, alors qu'un bundle Tauri complet prend plusieurs minutes et n'a de sens
# qu'une fois la version publiée.
name: desktop build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release à construire, par exemple desktop@v26.8.27"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    # FerrFlow publie une release par paquet du dépôt — `core@v…`, `vision@v…`,
    # `desktop@v…`. Sans ce filtre, chaque release de crate déclencherait un
    # bundle Tauri complet pour rien.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'desktop@v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Construire le tag publié, pas la tête de `main` : entre la release
          # et l'exécution de ce job, `main` a pu avancer, et l'installeur
          # porterait alors un numéro de version qui ne correspond à rien.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # `package_json_file` est indispensable : la racine du dépôt est un
      # workspace Cargo, sans `package.json`, et l'action y cherche la clé
      # `packageManager` par défaut. Sans ce chemin elle échoue au démarrage
      # avec « No pnpm version is specified ». `ci.yml` le passe déjà ; je
      # l'avais omis en recopiant ses étapes.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dépendances front
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `tauri build` enchaîne le `beforeBuildCommand` (build Angular) puis le
      # bundle.
      #
      # Les deux variables de signature sont lues par le CLI Tauri sous ces noms
      # exacts. `createUpdaterArtifacts` étant activé, leur absence n'est pas une
      # dégradation silencieuse : le bundle échoue, ce qui est le bon
      # comportement — une release sans signature ne serait acceptée par aucune
      # installation existante.
      - name: signtool dans le PATH
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'),
            (Join-Path $env:ProgramFiles 'Windows Kits/10/bin')
          )
          $found = foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                ForEach-Object {
                  $parsed = [version]'0.0.0.0'
                  if ([version]::TryParse($_.Directory.Parent.Name, [ref]$parsed)) {
                    [pscustomobject]@{ Version = $parsed; Dir = $_.Directory.FullName }
                  }
                }
            }
          }
          $best = $found | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $best) {
            Write-Error "signtool.exe introuvable sous $($roots -join ' | ')"
            exit 1
          }
          Write-Host "signtool $($best.Version) : $($best.Dir)"
          Add-Content -Path $env:GITHUB_PATH -Value $best.Dir

      - name: Outil de signature Authenticode
        shell: pwsh
        env:
          SIGNING_CLI_VERSION: "0.11.0"
          SIGNING_CLI_SHA256: "ddc6f6ef68631bf367ad051d7d37109e58d46095406e1fbba60d553b10f94393"
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'signing-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'artifact-signing-cli.exe'
          $url = "https://github.com/levminer/trusted-signing-cli/releases/download/${env:SIGNING_CLI_VERSION}/artifact-signing-cli.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne ${env:SIGNING_CLI_SHA256}) {
            Write-Error "empreinte inattendue pour artifact-signing-cli : $actual"
            exit 1
          }
          Write-Host "artifact-signing-cli ${env:SIGNING_CLI_VERSION} verifie"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Bundle Windows
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "$name manquant : l'installeur sortirait non signé" >&2
              exit 1
            fi
          done
          sign="artifact-signing-cli -e $SIGNING_ENDPOINT -a $SIGNING_ACCOUNT -c $SIGNING_PROFILE %1"
          pnpm tauri build --config "{\"bundle\":{\"windows\":{\"signCommand\":\"$sign\"}}}"

      # `target/` est à la RACINE du dépôt, pas sous `apps/desktop/src-tauri/` :
      # c'est un workspace Cargo, et tous les crates partagent le même
      # répertoire de sortie. Tauri l'annonce d'ailleurs en fin de bundle
      # (« Finished 2 bundles at: …/target/release/bundle/… »).
      # Le déclenchement manuel attache lui aussi, dès lors qu'on lui a donné un
      # tag de release. C'est la raison d'être de ce chemin : réparer une
      # publication ratée. Le limiter à l'évènement `release` le rendait
      # incapable de traiter exactement le cas pour lequel on s'en sert — une
      # release existante et vide, dont l'exécution automatique a échoué.
      #
      # Un `workflow_dispatch` sur une branche (`main`, une branche de test) ne
      # correspond à aucune release : la condition l'écarte, et l'étape suivante
      # conserve alors l'installeur en artefact.
      - name: Attacher l'installeur à la release
        if: >-
          github.event_name == 'release' ||
          startsWith(inputs.tag, 'desktop@v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(target/release/bundle/nsis/*.exe)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "aucun installeur NSIS produit — le bundle a échoué en silence" >&2
            exit 1
          fi

          # Signatures de mise à jour, produites par `createUpdaterArtifacts`.
          #
          # Tauri v2 signe l'INSTALLEUR lui-même et dépose un `.sig` détaché à
          # côté : `IdleWarden_x.y.z_x64-setup.exe` et `.exe.sig`. Il n'y a pas
          # d'archive intermédiaire — le `.nsis.zip` était la forme de Tauri v1,
          # et le chercher faisait échouer cette étape alors que le bundle avait
          # parfaitement réussi.
          #
          # Leur absence reste une erreur et non un avertissement : sans elles
          # la release est installable à la main mais invisible pour
          # l'auto-update, ce qui ne se remarque qu'au moment où personne ne
          # reçoit la version suivante.
          sigs=(target/release/bundle/nsis/*.exe.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "signature de mise à jour manquante" >&2
            ls -R target/release/bundle >&2 || true
            exit 1
          fi

          printf 'à publier : %s\n' "${bundles[@]}" "${sigs[@]}"
          gh release upload "$TAG" \
            "${bundles[@]}" "${sigs[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

      # Sur un déclenchement manuel il n'y a pas de release à alimenter, mais
      # l'artefact reste récupérable : c'est ce qui permet de tester une
      # construction sans publier quoi que ce soit.
      - name: Conserver l'installeur comme artefact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          !startsWith(inputs.tag, 'desktop@v')
        uses: actions/upload-artifact@v4
        with:
          name: idlewarden-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
