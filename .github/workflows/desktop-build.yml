# Construit l'installeur Windows et l'attache à la release du paquet `desktop`.
#
# Jusqu'ici rien ne produisait de binaire téléchargeable : `release.yml` ne fait
# que du versionnage FerrFlow, et l'application n'existait donc nulle part sous
# une forme installable. C'est ce que ce workflow ajoute.
#
# Volontairement séparé de `ci.yml` : la CI valide chaque commit et doit rester
# rapide, alors qu'un bundle Tauri complet prend plusieurs minutes et n'a de sens
# qu'une fois la version publiée.
name: desktop build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release à construire, par exemple desktop@v26.8.27"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    # FerrFlow publie une release par paquet du dépôt — `core@v…`, `vision@v…`,
    # `desktop@v…`. Sans ce filtre, chaque release de crate déclencherait un
    # bundle Tauri complet pour rien.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'desktop@v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Construire le tag publié, pas la tête de `main` : entre la release
          # et l'exécution de ce job, `main` a pu avancer, et l'installeur
          # porterait alors un numéro de version qui ne correspond à rien.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # `package_json_file` est indispensable : la racine du dépôt est un
      # workspace Cargo, sans `package.json`, et l'action y cherche la clé
      # `packageManager` par défaut. Sans ce chemin elle échoue au démarrage
      # avec « No pnpm version is specified ». `ci.yml` le passe déjà ; je
      # l'avais omis en recopiant ses étapes.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dépendances front
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `tauri build` enchaîne le `beforeBuildCommand` (build Angular) puis le
      # bundle.
      #
      # Les deux variables de signature sont lues par le CLI Tauri sous ces noms
      # exacts. `createUpdaterArtifacts` étant activé, leur absence n'est pas une
      # dégradation silencieuse : le bundle échoue, ce qui est le bon
      # comportement — une release sans signature ne serait acceptée par aucune
      # installation existante.
      - name: Bundle Windows
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # `target/` est à la RACINE du dépôt, pas sous `apps/desktop/src-tauri/` :
      # c'est un workspace Cargo, et tous les crates partagent le même
      # répertoire de sortie. Tauri l'annonce d'ailleurs en fin de bundle
      # (« Finished 2 bundles at: …/target/release/bundle/… »).
      - name: Attacher l'installeur à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(target/release/bundle/nsis/*.exe)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "aucun installeur NSIS produit — le bundle a échoué en silence" >&2
            exit 1
          fi

          # Signatures de mise à jour, produites par `createUpdaterArtifacts`.
          #
          # Tauri v2 signe l'INSTALLEUR lui-même et dépose un `.sig` détaché à
          # côté : `IdleWarden_x.y.z_x64-setup.exe` et `.exe.sig`. Il n'y a pas
          # d'archive intermédiaire — le `.nsis.zip` était la forme de Tauri v1,
          # et le chercher faisait échouer cette étape alors que le bundle avait
          # parfaitement réussi.
          #
          # Leur absence reste une erreur et non un avertissement : sans elles
          # la release est installable à la main mais invisible pour
          # l'auto-update, ce qui ne se remarque qu'au moment où personne ne
          # reçoit la version suivante.
          sigs=(target/release/bundle/nsis/*.exe.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "signature de mise à jour manquante" >&2
            ls -R target/release/bundle >&2 || true
            exit 1
          fi

          printf 'à publier : %s\n' "${bundles[@]}" "${sigs[@]}"
          gh release upload "$TAG" \
            "${bundles[@]}" "${sigs[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

      # Sur un déclenchement manuel il n'y a pas de release à alimenter, mais
      # l'artefact reste récupérable : c'est ce qui permet de tester une
      # construction sans publier quoi que ce soit.
      - name: Conserver l'installeur comme artefact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: idlewarden-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
