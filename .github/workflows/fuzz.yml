name: Fuzz

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target, capped at 1200'
        type: number
        default: 300

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [big, manifest, rules, bridge, install]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
        run: |
          corpus="fuzz/corpus/${{ matrix.target }}"
          seeds="fuzz/seeds/${{ matrix.target }}"
          mkdir -p "$corpus" "$seeds"
          cargo fuzz run "${{ matrix.target }}" "$corpus" "$seeds" -- \
            -max_total_time="$(( FUZZ_SECONDS < 1200 ? FUZZ_SECONDS : 1200 ))" \
            -timeout=30 \
            -rss_limit_mb=4096
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
