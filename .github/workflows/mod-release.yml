name: release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, e.g. mod/reference@v26.9.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-plugin:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'plugin/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Package the plugin folder
        id: package
        run: |
          set -euo pipefail
          rest=${TAG#plugin/}
          name=${rest%@v*}
          version=${rest#*@v}
          test -f "plugins/$name/plugin.json"
          id=$(jq -r .id "plugins/$name/plugin.json")
          archive="$id-$version.zip"
          (cd "plugins/$name" && zip -rX "$GITHUB_WORKSPACE/$archive" . -x CHANGELOG.md)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to the release
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" --clobber
          {
            echo "### $ARCHIVE"
            echo
            echo "sha256 for the registry entry: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package-cookie-clicker:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'mod/cookie-clicker@v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package the mod folder the game loads
        id: package
        run: |
          set -euo pipefail
          out=$(node mods/js/build.mjs "$RUNNER_TEMP/mod")
          archive="IdleWarden.CookieClicker-${TAG#mod/cookie-clicker@v}.zip"
          (cd "$out" && zip -rX "$GITHUB_WORKSPACE/$archive" .)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to the release
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" --clobber
          {
            echo "### $ARCHIVE"
            echo
            echo "sha256 for the registry entry: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'mod/reference@v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        working-directory: mods
        run: dotnet build src/IdleWarden.Reference --configuration Release --output out

      - name: Package the two assemblies BepInEx loads
        id: package
        working-directory: mods/out
        run: |
          set -euo pipefail
          archive="IdleWarden.Reference-${TAG#mod/reference@v}.zip"
          zip -X "$GITHUB_WORKSPACE/$archive" IdleWarden.Reference.dll IdleWarden.Bridge.dll
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to the release
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" --clobber
          {
            echo "### $ARCHIVE"
            echo
            echo "sha256 for the registry entry: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package-kale:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'mod/kale@v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Built against IdleWarden.Kale.GameStubs, which declares the game's
      # signatures and nothing else. The runner does not own the game, and the
      # game's assemblies are not ours to redistribute.
      # Deliberately without `--output`: that flag would drop the stub's
      # Assembly-CSharp into the same folder and it would end up in the archive,
      # shadowing the game's own assembly at run time.
      - name: Build
        working-directory: mods
        run: dotnet build src/IdleWarden.Kale --configuration Release

      - name: Package the three assemblies BepInEx loads
        id: package
        working-directory: mods/src/IdleWarden.Kale/bin/Release/netstandard2.1
        run: |
          set -euo pipefail
          if [ -f Assembly-CSharp.dll ]; then
            echo "::error::the stub would ship and shadow the game's own assembly" >&2
            exit 1
          fi
          archive="IdleWarden.Kale-${TAG#mod/kale@v}.zip"
          zip -X "$GITHUB_WORKSPACE/$archive"             IdleWarden.Kale.dll IdleWarden.Kale.Decisions.dll IdleWarden.Bridge.dll
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to the release
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" --clobber
          {
            echo "### $ARCHIVE"
            echo
            echo "sha256 for the registry entry: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
