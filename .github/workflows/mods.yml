name: mods

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the JavaScript side of the protocol
        run: node --test mods/js/tests/bridge.test.mjs
      - name: The mod builds into what the game loads
        run: |
          set -euo pipefail
          out=$(node mods/js/build.mjs "$RUNNER_TEMP/mod")
          test -f "$out/main.js" && test -f "$out/info.txt"

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test the protocol
        run: dotnet test tests/IdleWarden.Bridge.Tests --configuration Release

      # The Kale mod itself cannot be built here: a BepInEx plugin compiles
      # against the game's own assemblies, which are not ours to ship. Its
      # decisions are therefore a separate project that references nothing from
      # the game, so the part where bugs actually live is tested on every
      # commit rather than only on a machine that owns the game.
      - name: Test the Kale decisions
        run: dotnet test tests/IdleWarden.Kale.Decisions.Tests --configuration Release

      - name: The decisions stay independent of any game assembly
        run: |
          if grep -rnE "UnityEngine|Assembly-CSharp|BepInEx" src/IdleWarden.Kale.Decisions; then
            echo "::error::the decisions project must stay buildable without the game"
            exit 1
          fi
          echo "ok"

      - name: Build the reference mod
        run: dotnet build src/IdleWarden.Reference --configuration Release --output out

      - name: The build holds the two files the release archive ships
        run: test -f out/IdleWarden.Reference.dll && test -f out/IdleWarden.Bridge.dll

      # This is why IdleWarden.Kale.GameStubs exists: a BepInEx plugin normally
      # compiles against the game's own assemblies, which are not ours to ship, so
      # without the stubs CI could not build this mod at all and the release would
      # have to be made by hand.
      # No `--output` here, unlike the reference mod above. That flag sends every
      # project in the graph to one folder and overrides the `Private="false"` that
      # keeps the stub out, so the mod would ship an Assembly-CSharp of its own.
      - name: Build the Kale mod against the game stubs
        run: dotnet build src/IdleWarden.Kale --configuration Release

      - name: The stub never ships next to the mod
        run: |
          out=src/IdleWarden.Kale/bin/Release/netstandard2.1
          if [ -f "$out/Assembly-CSharp.dll" ]; then
            echo "::error::a stub named Assembly-CSharp beside the mod shadows the game's own, and every call throws"
            exit 1
          fi
          for name in IdleWarden.Kale.dll IdleWarden.Kale.Decisions.dll IdleWarden.Bridge.dll; do
            test -f "$out/$name" || { echo "::error::$name missing from the mod output"; exit 1; }
          done
          echo "ok"

      - name: The plugin version comes from the project, never a literal
        run: |
          if grep -rnE '\[BepInPlugin\([^)]*"[0-9]+\.[0-9]+' src; then
            echo "::error::a hardcoded version in [BepInPlugin] drifts from the release tag; use MyPluginInfo.PLUGIN_VERSION"
            exit 1
          fi
          echo "ok"
