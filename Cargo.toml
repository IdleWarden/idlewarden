[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/capture",
    "crates/vision",
    "crates/input",
    "crates/bridge",
    "crates/plugin-host",
    "crates/agent",
    "crates/core",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
repository = "https://github.com/idlewarden/idlewarden"
authors = ["The IdleWarden contributors"]

[workspace.dependencies]
idlewarden-plugin-api = { path = "crates/plugin-api" }
idlewarden-capture    = { path = "crates/capture" }
idlewarden-vision     = { path = "crates/vision" }
idlewarden-input      = { path = "crates/input" }
idlewarden-bridge     = { path = "crates/bridge" }
idlewarden-plugin-host = { path = "crates/plugin-host" }
idlewarden-agent      = { path = "crates/agent" }
idlewarden-core       = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = { version = "1", features = ["serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
