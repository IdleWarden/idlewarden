[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/capture",
    "crates/vision",
    "crates/input",
    "crates/bridge",
    "crates/plugin-host",
    "crates/agent",
    "crates/core",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
repository = "https://github.com/IdleWarden/idlewarden"
authors = ["The IdleWarden contributors"]

[workspace.dependencies]
idlewarden-plugin-api = { path = "crates/plugin-api", version = "26.8.26" }
idlewarden-capture    = { path = "crates/capture", version = "26.9.2" }
idlewarden-vision     = { path = "crates/vision", version = "26.8.26" }
idlewarden-input      = { path = "crates/input", version = "26.8.28" }
idlewarden-bridge     = { path = "crates/bridge", version = "26.8.27" }
idlewarden-plugin-host = { path = "crates/plugin-host", version = "26.8.26" }
idlewarden-agent      = { path = "crates/agent", version = "26.8.26" }
idlewarden-core       = { path = "crates/core", version = "26.8.28" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = { version = "1", features = ["serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
