[package]
name = "idlewarden-desktop"
description = "Desktop shell: an adapter over idlewarden-core's Command and Event."
version = "26.8.27"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "idlewarden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idlewarden-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
# Télécharge, vérifie la signature minisign et remplace le binaire installé.
# La vérification est le point important : sans elle, l'URL servie par
# l'endpoint serait un vecteur d'exécution de code arbitraire.
tauri-plugin-updater = "2"
uuid = { version = "1.20.0", features = ["v4"] }
